<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>Novalume Player</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#090b10;color:#f5f7fb}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 20%,#1b2333 0,#090b10 58%)}
main{position:relative;width:100%;height:100%;display:grid;place-items:center}
canvas{width:100%;height:100%;display:block;outline:none;background:#05070b}
#loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .35s ease;background:radial-gradient(circle at 50% 35%,rgba(50,70,105,.42),rgba(9,11,16,.96) 62%)}
#loading.done{opacity:0}
.card{width:min(420px,calc(100% - 48px));display:grid;gap:18px;text-align:center}
.mark{font-size:30px;font-weight:750;letter-spacing:-.04em}
.mark span{color:#82aaff}
#status{min-height:22px;color:#b8c1d1;font-size:14px}
.track{height:3px;background:#252c39;border-radius:999px;overflow:hidden}
#progress{height:100%;width:8%;background:linear-gradient(90deg,#6994ff,#9fc4ff);border-radius:inherit;transition:width .2s ease}
#requirements{position:absolute;inset:auto 16px 14px;color:#7f8999;font-size:11px;letter-spacing:.02em}
</style>
</head>
<body>
<main>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<section id="loading">
<div class="card">
<div class="mark">Nova<span>lume</span></div>
<div id="status">Preparing browser runtime…</div>
<div class="track"><div id="progress"></div></div>
</div>
<div id="requirements"></div>
</section>
</main>
<script>
const loading=document.querySelector('#loading');
const statusNode=document.querySelector('#status');
const progressNode=document.querySelector('#progress');
const requirementsNode=document.querySelector('#requirements');
const capabilities=[];
if(!crossOriginIsolated)capabilities.push('Cross-origin isolation is required for multithreading');
if(!navigator.gpu)capabilities.push('WebGPU is not available in this browser');
requirementsNode.textContent=capabilities.join(' · ');
let totalDependencies=0;
var Module={
canvas:document.querySelector('#canvas'),
arguments:new URLSearchParams(location.search).getAll('arg'),
preRun:[()=>{
for(const path of ['/persistent','/persistent/Roblox','/persistent/Roblox/imports']){
try{FS.mkdir(path)}catch(error){}
}
try{FS.mount(IDBFS,{},'/persistent')}catch(error){}
addRunDependency('novalume-idbfs');
FS.syncfs(true,error=>{
if(error)console.warn('Persistent storage initialization failed',error);
removeRunDependency('novalume-idbfs');
});
}],
print:(...values)=>console.log(...values),
printErr:(...values)=>console.error(...values),
setStatus(value){
statusNode.textContent=value||'Running';
if(!value||value==='Running...')setTimeout(()=>loading.classList.add('done'),250);
const match=value&&value.match(/\((\d+)\/(\d+)\)/);
if(match)progressNode.style.width=`${Math.max(8,100*(Number(match[2])-Number(match[1]))/Number(match[2]))}%`;
},
monitorRunDependencies(remaining){
totalDependencies=Math.max(totalDependencies,remaining);
if(totalDependencies)progressNode.style.width=`${Math.max(8,100*(totalDependencies-remaining)/totalDependencies)}%`;
}
};
window.addEventListener('error',event=>{loading.classList.remove('done');statusNode.textContent=event.message;});
</script>
{{{ SCRIPT }}}
</body>
</html>
